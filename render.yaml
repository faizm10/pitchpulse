# PitchPulse — FastAPI prediction API on Render
#
# Production URL (example): https://pitchpulse-api-dsye.onrender.com
# Vercel → Settings → Environment Variables:
#   PREDICT_API_URL=https://pitchpulse-api-dsye.onrender.com
# Then redeploy the frontend (env vars apply on new deploy only).
#
# Free tier: sleeps after ~15 min idle; first request may take 30–60s.
# For launch traffic, use plan: starter (or higher) — see README.md § Production.

services:
  - type: web
    name: pitchpulse-api
    runtime: python
    plan: free
    # plan: starter   # uncomment for always-on (recommended before marketing)
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.13"
      - key: TRAIN_ON_STARTUP
        value: "0"
      # Optional: allow browser calls (Next.js proxies server-side; CORS optional)
      - key: CORS_ORIGINS
        sync: false
